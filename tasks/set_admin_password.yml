---
- name: Fail if the YaCy admin password is not defined
  ansible.builtin.fail:
    msg: >-
      You need to define `yacy_conf_password` (a password of more than 2 characters)
      before running the playbook with the `ensure-yacy-admin-password` tag.
  when: "yacy_conf_password | string | length < 3"

# See: https://github.com/yacy/yacy_search_server/blob/master/bin/passwd.sh and https://yacy.net/faq/#password-reset-while-yacy-is-running
#
# The password is passed as its own argv entry rather than spliced into a command
# string. `ansible.builtin.command` splits a `cmd` string with shlex, which would
# quietly mangle any password containing whitespace or quotes - and `no_log` would
# hide the evidence, leaving an operator locked out of an instance that reported
# success. `devture_systemd_docker_base_host_command_docker` is several words
# (`/usr/bin/env docker` by default), so it is split on whitespace deliberately.
- name: Ensure YaCy admin password is set
  ansible.builtin.command:
    argv: >-
      {{
        (devture_systemd_docker_base_host_command_docker | split)
        + ['exec', yacy_identifier, 'yacy_search_server/bin/passwd.sh', yacy_conf_password]
      }}
  register: yacy_password_result
  changed_when: "'Password successfully changed' in yacy_password_result.stdout"
  no_log: true
